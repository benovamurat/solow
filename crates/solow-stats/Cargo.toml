[package]
name = "solow-stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust statistical tests and diagnostics: t-tests, ANOVA, Wald, F-test, Levene, Bartlett, Fligner, Shapiro-Wilk, Anderson-Darling, Kolmogorov-Smirnov, Mann-Whitney U, Kruskal-Wallis, McNemar, chi-squared, Pearson, Spearman, Kendall correlations, meta-analysis, robust HC and HAC covariances, VIF, mediation, power analysis."
keywords = ["statistics", "wald", "anova", "hypothesis", "solow"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
num-traits.workspace = true
solow-core.workspace = true
solow-linalg.workspace = true
solow-distributions.workspace = true
solow-regression.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
# Derives Serialize/Deserialize on public test-result structs (Wald, F, and
# other tests that expose named fields).
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
