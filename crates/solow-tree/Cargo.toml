[package]
name = "solow-tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust decision trees for machine learning: decision tree classifier and regressor, extra tree classifier and regressor, with Gini, entropy, MSE, and MAE splitters and deterministic tie-breaking."
keywords = ["decision-tree", "cart", "gini", "entropy", "machine-learning"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
solow-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
