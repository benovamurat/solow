[package]
name = "solow-neural"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust neural networks: multi-layer perceptron classifier and regressor with ReLU, tanh, logistic, and identity activations and SGD or Adam optimizers, Bernoulli restricted Boltzmann machine."
keywords = ["neural-network", "mlp", "backprop", "sgd", "machine-learning"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
solow-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
