[package]
name = "solow-multi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust multiclass and multi-output meta-estimators: one-vs-rest, one-vs-one, output code, multi-output regressor and classifier, classifier chain, regressor chain."
keywords = ["multi-class", "multi-output", "one-vs-rest", "chain", "classification"]
