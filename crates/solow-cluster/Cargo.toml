[package]
name = "solow-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust unsupervised clustering for machine learning: k-means with k-means++, mini-batch k-means, bisecting k-means, DBSCAN, HDBSCAN, OPTICS, mean shift, affinity propagation, spectral clustering, agglomerative clustering with single, complete, average, and Ward linkage, Birch, Gaussian mixture, Bayesian Gaussian mixture."
keywords = ["clustering", "kmeans", "dbscan", "machine-learning", "unsupervised"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
solow-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
