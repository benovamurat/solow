[package]
name = "solow-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust text feature extraction for NLP: count vectorizer, TF-IDF vectorizer, hashing vectorizer, feature hasher, dict vectorizer with configurable tokenizer, n-grams, min and max document frequency, and stop words."
keywords = ["text", "vectorizer", "tfidf", "n-gram", "machine-learning"]
categories = ["science", "mathematics", "text-processing"]

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
solow-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
