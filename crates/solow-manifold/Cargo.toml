[package]
name = "solow-manifold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust manifold learning and nonlinear dimensionality reduction: Isomap, locally linear embedding (LLE), multidimensional scaling (MDS), spectral embedding, t-SNE."
keywords = ["manifold", "isomap", "lle", "tsne", "embedding"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
solow-core.workspace = true
solow-linalg.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
