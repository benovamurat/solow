[package]
name = "solow-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust regression, classification, forecast, and cluster evaluation metrics for machine learning: MSE, MAE, R2, RMSE, ROC AUC, average precision, log loss, calibration error, silhouette, adjusted Rand, normalized mutual information, homogeneity, completeness, v-measure, pairwise kernels and distances, effect sizes (Cohen d, Hedges g, Cliff delta, Cramer V), classification report."
keywords = ["statistics", "metrics", "regression", "classification", "forecasting"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
num-traits.workspace = true
thiserror.workspace = true
solow-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
# Derives Serialize/Deserialize on every public result / report struct so an
# entire evaluation loop can be persisted as JSON.
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
