[package]
name = "solow-neighbors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust nearest-neighbor structures and estimators for machine learning: KD-tree, ball tree, k-nearest-neighbors classifier and regressor, radius-neighbors classifier and regressor, nearest centroid, local outlier factor (LOF), kernel density estimator."
keywords = ["kdtree", "nearest-neighbor", "knn", "machine-learning", "search"]
categories = ["science", "mathematics", "data-structures"]

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
solow-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
