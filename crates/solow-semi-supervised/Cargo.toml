[package]
name = "solow-semi-supervised"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust semi-supervised learning: self-training classifier, label propagation, label spreading."
keywords = ["semi-supervised", "label-propagation", "self-training", "classification"]
