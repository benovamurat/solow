[package]
name = "solow-naive-bayes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust naive Bayes classifiers for machine learning: Gaussian, multinomial, Bernoulli, complement, and categorical naive Bayes with Laplace or Lidstone smoothing."
keywords = ["naive-bayes", "classifier", "gaussian", "multinomial", "machine-learning"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
solow-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
