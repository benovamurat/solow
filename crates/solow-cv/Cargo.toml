[package]
name = "solow-cv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust cross-validation and resampling for machine learning: KFold, StratifiedKFold, TimeSeriesSplit, LeaveOneOut, LeavePOut, ShuffleSplit, GroupKFold, StratifiedGroupKFold, PurgedKFold, CombinatorialPurgedKFold, RepeatedKFold, StratifiedShuffleSplit, GroupShuffleSplit, bootstrap CI, block bootstrap, learning curve, validation curve, permutation test."
keywords = ["statistics", "cross-validation", "resampling", "model-selection", "time-series"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
solow-core.workspace = true
rayon = { version = "1.10", optional = true }
serde = { workspace = true, optional = true }

[features]
default = []
# Enables `cross_val_score_parallel` for evaluating folds in parallel via rayon.
parallel = ["dep:rayon"]
# Derives Serialize/Deserialize on the public fold and CI structs.
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
