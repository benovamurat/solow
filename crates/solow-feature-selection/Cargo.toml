[package]
name = "solow-feature-selection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust feature selection for machine learning: select-K-best with ANOVA F, regression F, or mutual information, variance threshold, recursive feature elimination (RFE), percentile, FPR, FDR, FWE, and sequential feature selector."
keywords = ["feature-selection", "rfe", "select-k-best", "machine-learning", "preprocessing"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
solow-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
