[package]
name = "solow-regression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust linear regression and regularization: OLS, WLS, GLS, GLSAR, Ridge, Lasso, ElasticNet, cross-validated regularization, LARS, LassoLars, LassoLarsIC, OrthogonalMatchingPursuit, Huber, quantile, RANSAC, TheilSen, SGD, Perceptron, Passive Aggressive, Bayesian Ridge, ARD, multi-task, kernel ridge. Deterministic, memory safe."
keywords = ["regression", "ols", "wls", "gls", "solow"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
num-traits.workspace = true
solow-core.workspace = true
solow-linalg.workspace = true
solow-distributions.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true
serde.workspace = true
serde_json.workspace = true
proptest = "1.8"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
