[package]
name = "solow-distributions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust statistical distributions and special functions: normal, Student t, chi-squared, F, gamma, beta, Weibull, log-normal, Poisson, negative binomial, GEV, GPD, plus lgamma, digamma, erf, incomplete beta and gamma."
keywords = ["distributions", "probability", "statistics", "solow"]
categories = ["science", "mathematics"]

[dependencies]
num-traits.workspace = true
solow-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true
serde_json.workspace = true
proptest = "1.8"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
