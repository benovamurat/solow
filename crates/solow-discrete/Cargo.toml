description = "Rust discrete choice and count regression: logit, probit, Poisson, negative binomial, generalized Poisson, multinomial logit, ordered logit and probit, zero-inflated Poisson, hurdle, conditional logit and Poisson, truncated Poisson, cross-validated logistic regression."
