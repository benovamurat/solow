[package]
name = "solow-linalg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure Rust linear algebra for statistics and machine learning: SVD, eigendecomposition, Cholesky, QR, LU, matrix pseudoinverse. No system LAPACK or BLAS. Memory safe."
keywords = ["linalg", "svd", "cholesky", "matrix", "solow"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
num-traits.workspace = true
solow-core.workspace = true

[dev-dependencies]
approx.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
