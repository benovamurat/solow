[package]
name = "solow-discriminant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust discriminant analysis for machine learning classification: linear discriminant analysis (Fisher 1936) and quadratic discriminant analysis with pooled and per-class covariance."
keywords = ["lda", "qda", "discriminant", "classifier", "machine-learning"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
solow-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
