[package]
name = "solow-covariance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rust covariance matrix estimators: empirical covariance, shrunk covariance, Ledoit-Wolf, Oracle Approximating Shrinkage (OAS), Rousseeuw FAST-MCD minimum covariance determinant, graphical lasso, elliptic envelope outlier detection."
keywords = ["covariance", "ledoit-wolf", "graphical-lasso", "shrinkage", "robust"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
solow-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
