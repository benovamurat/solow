[package]
name = "solow-graphics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust statistical graphics: QQ plot, PP plot, ACF and PACF plots, residual diagnostics, influence plots, regression plots rendered as SVG."
keywords = ["diagnostics", "qqplot", "plotting", "solow"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
num-traits.workspace = true
solow-core.workspace = true
solow-distributions.workspace = true
solow-regression.workspace = true
solow-viz.workspace = true

[dev-dependencies]
approx.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
