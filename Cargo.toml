solow-discrete = { path = "crates/solow-discrete", version = "0.7.3" }
solow-stats = { path = "crates/solow-stats", version = "0.7.3" }
solow-tsa = { path = "crates/solow-tsa", version = "0.7.3" }
solow-robust = { path = "crates/solow-robust", version = "0.7.3" }
solow-nonparametric = { path = "crates/solow-nonparametric", version = "0.7.3" }
solow-multivariate = { path = "crates/solow-multivariate", version = "0.7.3" }
solow-duration = { path = "crates/solow-duration", version = "0.7.3" }
solow-statespace = { path = "crates/solow-statespace", version = "0.7.3" }
solow-var = { path = "crates/solow-var", version = "0.7.3" }
