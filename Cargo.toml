[workspace]
resolver = "2"
exclude = ["crates/solow-py"]
members = [
    "crates/solow-core",
    "crates/solow-linalg",
    "crates/solow-distributions",
    "crates/solow-optimize",
    "crates/solow-regression",
    "crates/solow-glm",
    "crates/solow-discrete",
    "crates/solow-stats",
    "crates/solow-tsa",
    "crates/solow-robust",
    "crates/solow-nonparametric",
    "crates/solow-multivariate",
    "crates/solow-duration",
    "crates/solow-statespace",
    "crates/solow-var",
    "crates/solow-mixed",
    "crates/solow-gee",
    "crates/solow-gam",
    "crates/solow-impute",
    "crates/solow-graphics",
    "crates/solow-regime",
    "crates/solow-othermod",
    "crates/solow-copula",
    "crates/solow-fit",
    "crates/solow-bayes",
    "crates/solow-emplike",
    "crates/solow-formula",
    "crates/solow-summary",
    "crates/solow-bench",
    "crates/solow-viz",
    "crates/solow-metrics",
    "crates/solow-cv",
    "crates/solow-preprocessing",
    "crates/solow-cluster",
    "crates/solow-neighbors",
    "crates/solow-tree",
    "crates/solow-ensemble",
    "crates/solow-naive-bayes",
    "crates/solow-discriminant",
    "crates/solow-feature-selection",
    "crates/solow-pipeline",
    "crates/solow-svm",
    "crates/solow-neural",
    "crates/solow-manifold",
    "crates/solow-decomposition",
    "crates/solow-text",
    "crates/solow-covariance",
    "crates/solow-cross-decomposition",
    "crates/solow-kernel-approx",
    "crates/solow-gp",
    "crates/solow-semi-supervised",
    "crates/solow-multi",
    "crates/solow-calibration",
    "crates/solow-datasets",
    "crates/solow",
]

[workspace.package]
version = "0.7.3"
edition = "2021"
rust-version = "1.80"
license = "BSD-3-Clause"
authors = ["Murat Ova"]
description = "The comprehensive statistics and machine learning stack for Rust. Regression, generalized linear models, discrete choice, time series, state space, survival analysis, mixed effects, Bayesian inference, clustering, tree ensembles, SVM, neural networks, kernel methods, dimensionality reduction, and change point detection. 57 focused crates, memory safe, pure Rust."
repository = "https://github.com/benovamurat/solow"
homepage = "https://stochasticminds.com"
documentation = "https://docs.rs/solow"
keywords = ["statistics", "econometrics", "regression", "time-series", "data-science"]
categories = ["science", "mathematics"]
readme = "README.md"

[workspace.dependencies]
ndarray = "0.16"
num-traits = "0.2"
num-complex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
approx = "0.5"
criterion = "0.5"

solow-core = { path = "crates/solow-core", version = "0.7.3" }
solow-linalg = { path = "crates/solow-linalg", version = "0.7.3" }
solow-distributions = { path = "crates/solow-distributions", version = "0.7.3" }
solow-optimize = { path = "crates/solow-optimize", version = "0.7.3" }
solow-regression = { path = "crates/solow-regression", version = "0.7.3" }
